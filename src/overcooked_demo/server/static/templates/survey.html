<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title id="page-title">Survey</title>
    <link rel="stylesheet"
        href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
        crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#0f172a;--text:#e2e8f0;--muted:#94a3b8;--a1:#22d3ee;--a2:#a78bfa;--panel:rgba(255,255,255,.06);--brd:rgba(255,255,255,.12)}
        html,body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100%}
        .wrap{max-width:960px;margin:28px auto 48px;padding:0 14px}
        h1{font-weight:800;letter-spacing:-.01em;margin-bottom:6px;text-align:center}
        p.sub{color:var(--muted);text-align:center;margin-bottom:14px}
        .pid{background:var(--panel);border:1px solid var(--brd);border-radius:10px;padding:8px 12px;display:inline-block;margin:0 auto 12px;font-weight:600}
        .card{background:var(--panel);border:1px solid var(--brd);border-radius:14px;padding:16px}
        .btn-cta{background:linear-gradient(90deg,var(--a1),var(--a2));border:0;border-radius:12px;padding:12px 18px;font-weight:700;color:#081223;cursor:pointer;width:100%}
        .btn-cta:disabled{opacity:0.5;cursor:not-allowed}
        .form-group{margin-bottom:20px}
        .form-label{font-weight:600;margin-bottom:8px;display:block;color:var(--text)}
        .form-control{background:rgba(2,6,23,.45);border:1px solid rgba(255,255,255,.2);border-radius:8px;color:var(--text);padding:10px 12px}
        .radio-group, .checkbox-group{display:flex;flex-direction:column;gap:12px}
        .option-item{display:flex;align-items:center;padding:10px;border-radius:8px;cursor:pointer;border:1px solid rgba(255,255,255,.12);transition:all 0.2}
        .option-item:hover{border-color:rgba(255,255,255,0.25);background:rgba(255,255,255,0.03)}
        .option-item input{margin-right:10px}
        .status-message{padding:12px;margin-bottom:24px;border-radius:8px;font-size:14px;display:none}
        .status-message.info{background:rgba(34,211,238,.15);color:#22d3ee;border:1px solid rgba(34,211,238,.3);display:block}
        .status-message.success{background:rgba(74,222,128,.15);color:#4ade80;border:1px solid rgba(74,222,128,.3);display:block}
        .status-message.error{background:rgba(239,68,68,.15);color:#ef4444;border:1px solid rgba(239,68,68,.3);display:block}
    </style>
</head>
<body>
    <div class="wrap">
        <h1 id="survey-title">Loading...</h1>
        <p id="survey-subtitle" class="sub"></p>
        <div class="text-center"><span id="pid-display" class="pid"></span></div>
        <div class="card">
            <!-- Survey form -->
            <form id="surveyForm">
                <!-- Questions container -->
                <div id="questions-container"></div>
                <!-- Submit button -->
                <button type="submit" class="btn-cta">Submit</button>
            </form>
            <!-- Status Message -->
            <div id="statusMessage" class="status-message"></div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/2.3.0/socket.io.js"></script>
    <script>
        const u = new URL(window.location.href);
        const surveyType = u.searchParams.get('type') || '';
        const pid = u.searchParams.get('pid') || '';
        const order = u.searchParams.get('order') || 'route1';
        const nextUrl = u.searchParams.get('next') || '/';

        function showMessage(message, type = 'info') {
            const el = document.getElementById('statusMessage');
            el.className = `status-message ${type}`;
            el.textContent = message;
        }

        // Initializes the survey by fetching configuration and dynamically building the form.
        // Handles nested route logic (route1/route2) and different question types.
        async function initSurvey() {
            try {
                // Fetch the survey configuration containing titles, subtitles, and questions
                const resp = await fetch('/static/json/survey_config.json');
                const data = await resp.json();

                // Retrieve the base configuration for the specific survey type (e.g., survey_1)
                const surveyBase = data.surveys[surveyType];

                // Resolve the specific survey structure based on the participant's route (order)
                let survey = surveyBase;
                if (surveyBase[order]) {
                    survey = { 
                        title: surveyBase.title, 
                        subtitle: surveyBase.subtitle, 
                        questions: surveyBase[order].questions 
                    };
                }

                // Update UI headers and participant information
                document.getElementById('page-title').innerText = survey.title;
                document.getElementById('survey-title').innerText = survey.title;
                document.getElementById('survey-subtitle').innerText = survey.subtitle;
                document.getElementById('pid-display').innerText = pid ? `Participant ID: ${pid}` : '';

                const container = document.getElementById('questions-container');

                // Iterate through questions to generate the appropriate HTML components
                survey.questions.forEach(q => {
                    const block = document.createElement('div');
                    block.className = 'form-group';
                    block.innerHTML = `<label class="form-label">${q.label}</label>`;

                    if (q.type === 'text') {
                        block.innerHTML += `<input type="text" name="${q.id}" class="form-control" placeholder="Insert your answer..." ${q.required ? 'required' : ''}>`;
                    } else {
                        const group = document.createElement('div');
                        
                        // Dynamically assign CSS class based on question type for proper styling
                        group.className = q.type === 'radio' ? 'radio-group' : 'checkbox-group';
                        
                        q.options.forEach(opt => {
                            const label = document.createElement('label');
                            label.className = 'option-item';
                            label.innerHTML = `<input type="${q.type}" name="${q.id}" value="${opt}" ${q.required ? 'required' : ''}> <span>${opt}</span>`;
                            group.appendChild(label);
                        });
                        block.appendChild(group);
                    }
                    container.appendChild(block);
                });
            } catch (err) {
                showMessage('Error loading survey configuration.', 'error');
            }
        }

        // Shutdown agent on survey and post_questionnaire pages
        if (surveyType !== 'pre_questionnaire' && typeof io !== 'undefined') {
            const sock = io();
            sock.on('connect', () => {
                console.log(`[${surveyType}] Emitting agent:shutdown...`);
                sock.emit('agent:shutdown', { context: `${surveyType}-page` });
            });
            setTimeout(() => { if (sock.connected) sock.disconnect(); }, 2000);
        }

        // surveyForm submission handler
        document.getElementById('surveyForm').onsubmit = async (e) => {
            e.preventDefault();

            // Collect form data
            const formData = new FormData(e.target);
            const responses = {};

            // Logic to handle checkbox
            for (let [key, value] of formData.entries()) {
                if (responses[key]) {
                    if (!Array.isArray(responses[key])) responses[key] = [responses[key]];
                    responses[key].push(value);
                } else {
                    responses[key] = value;
                }
            }

            // Prepare payload
            const payload = {
                pid: pid,
                route: order,
                survey_type: surveyType,
                responses: responses
            };

            console.log(`[${payload.survey_type} Submission]:`, payload);
            showMessage(`Submitting ${surveyType}...`, 'info');

            // Submit to backend
            try {
                const success = await fetch('/api/survey/submit', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });

                if (success.ok) {
                    showMessage('Submitted! Redirecting...', 'success');
                    document.getElementById('surveyForm').style.opacity = '0.5';
                    document.getElementById('surveyForm').style.pointerEvents = 'none';
                    setTimeout(() => { window.location.href = nextUrl; }, 2000);
                } else {
                    throw new Error();
                }
            } catch (err) {
                showMessage('Submission failed. Please try again.', 'error');
            }
        };

        initSurvey();
    </script>
</body>
</html>
